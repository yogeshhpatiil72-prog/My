<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATIL NEO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b12;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
}
.logo{font-size:22px;font-weight:bold;cursor:pointer}
.logo span{color:#b9f36b}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#151923;
  color:white;
}
.container{padding:20px}
.hero{
  padding:35px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#26233f,#101722);
  margin-bottom:25px;
}
.hero h1{font-size:38px;margin-bottom:10px}
.hero span{color:#b9f36b}
button{
  background:#b9f36b;
  border:0;
  padding:12px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
  margin-top:20px;
}
.card{
  background:#131823;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #252b38;
}
.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}
.info{padding:12px}
.info h3{margin:0 0 8px}
.muted{color:#a3aabd;font-size:13px}
footer{
  padding:25px;
  color:#999;
  text-align:center;
  margin-top:30px;
}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
  <div class="logo" id="logo">PATIL <span>NEO</span></div>
  <button onclick="alert('Premium features coming soon!')">
    PREMIUM
  </button>
</header>

<div class="container">

  <section class="hero">
    <p>WELCOME TO PATIL NEO</p>
    <h1>Discover Your<br><span>Next Movie.</span></h1>
    <p class="muted">
      Explore movies and access authorized watch links.
    </p>
    <button onclick="document.getElementById('movies').scrollIntoView()">
      Explore Movies ↗
    </button>
  </section>

  <input
    type="search"
    id="search"
    placeholder="Search movies..."
  >

  <h2 id="movies">Latest Movies</h2>

  <div class="grid" id="movieGrid">
    <p class="muted">Movies will appear here.</p>
  </div>

</div>

<footer>
  PATIL NEO © 2026<br>
  Only authorized movie links are supported.
</footer>

<script>
const movies = [];

function displayMovies(){
  const search = document
    .getElementById("search")
    .value.toLowerCase();

  const grid = document.getElementById("movieGrid");

  const filtered = movies.filter(movie =>
    movie.title.toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    grid.innerHTML =
      '<p class="muted">No movies found.</p>';
    return;
  }

  grid.innerHTML = filtered.map(movie => `
    <div class="card">
      <img src="${movie.poster}" alt="">
      <div class="info">
        <h3>${movie.title}</h3>
        <p class="muted">${movie.category}</p>
        <button onclick="window.open('${movie.watch}','_blank')">
          Watch
        </button>
      </div>
    </div>
  `).join("");
}

document.getElementById("search")
  .addEventListener("input",displayMovies);

let clicks = 0;
let timer;

document.getElementById("logo").onclick = function(){
  clicks++;
  clearTimeout(timer);

  timer = setTimeout(() => clicks = 0,1500);

  if(clicks === 3){
    clicks = 0;
    alert("Admin panel will be connected in the next step.");
  }
};

displayMovies();
</script>

</body>
</html>
